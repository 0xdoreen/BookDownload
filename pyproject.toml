[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bookdownload"
version = "0.1.0"
description = "A local, resumable ebook queue and authorized browser download assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bookdownload = "bookdownload.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookdownload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
